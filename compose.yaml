services:
  backend:
    build:
      context: ./backend
      target: runtime
    environment:
      XOPS_ENVIRONMENT: dev
      XOPS_COPILOT_HOST: ${XOPS_COPILOT_HOST:-}
      XOPS_PLATFORM_NAMESPACE: ${XOPS_PLATFORM_NAMESPACE:-}
      KUBECONFIG: /kube/config
    volumes:
      - type: bind
        source: ${KUBECONFIG_FILE:-${USERPROFILE:-${HOME}}/.kube/config}
        target: /kube/config
        read_only: true
        bind:
          create_host_path: false
    init: true
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  frontend:
    build:
      context: ./frontend
      target: runtime
    ports:
      - '127.0.0.1:${XOPS_PORT:-8080}:8080'
    volumes:
      - type: bind
        source: ${MTS_FONTS_DIR:-./mts_shrift/ШРИФТ/Web}
        target: /brand-fonts
        read_only: true
    depends_on:
      backend:
        condition: service_healthy
    init: true
    security_opt:
      - no-new-privileges:true

  frontend-checks:
    profiles: [test]
    build:
      context: ./frontend
      target: checks
    init: true

  backend-checks:
    profiles: [test]
    build:
      context: ./backend
      target: checks
    init: true

  e2e:
    profiles: [test]
    build:
      context: ./frontend
      target: browser-tests
    environment:
      PLAYWRIGHT_BASE_URL: http://frontend:8080
    depends_on:
      frontend:
        condition: service_healthy
    init: true
