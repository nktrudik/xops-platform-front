services:
  postgres:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: xops
      POSTGRES_USER: xops
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Задайте POSTGRES_PASSWORD в .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U xops -d xops']
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      target: runtime
    environment:
      XOPS_ENVIRONMENT: dev
      XOPS_COPILOT_HOST: ${XOPS_COPILOT_HOST:-}
      XOPS_PLATFORM_NAMESPACE: ${XOPS_PLATFORM_NAMESPACE:-}
      KUBECONFIG: /kube/config
      XOPS_DATABASE_URL: postgresql://xops@postgres:5432/xops
      PGPASSWORD: ${POSTGRES_PASSWORD:?Задайте POSTGRES_PASSWORD в .env}
      XOPS_ADMIN_PASSWORD_HASH: ${XOPS_ADMIN_PASSWORD_HASH:?Задайте хеш пароля администратора в .env}
      XOPS_COOKIE_SECURE: ${XOPS_COOKIE_SECURE:-false}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - type: bind
        source: ${KUBECONFIG_FILE:-${USERPROFILE:-${HOME}}/.kube/config}
        target: /kube/config
        read_only: true
        bind:
          create_host_path: false
    init: true
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  frontend:
    build:
      context: ./frontend
      target: runtime
    ports:
      - '127.0.0.1:${XOPS_PORT:-8080}:8080'
    volumes:
      - type: bind
        source: ${MTS_FONTS_DIR:-./mts_shrift/ШРИФТ/Web}
        target: /brand-fonts
        read_only: true
    depends_on:
      backend:
        condition: service_healthy
    init: true
    security_opt:
      - no-new-privileges:true

  frontend-checks:
    profiles: [test]
    build:
      context: ./frontend
      target: checks
    init: true

  backend-checks:
    profiles: [test]
    build:
      context: ./backend
      target: checks
    init: true

  e2e:
    profiles: [test]
    build:
      context: ./frontend
      target: browser-tests
    environment:
      PLAYWRIGHT_BASE_URL: http://frontend:8080
    depends_on:
      frontend:
        condition: service_healthy
    init: true

volumes:
  postgres-data:
