apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: ${KUBE_NAMESPACE}
  labels:
    app: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      serviceAccountName: ${COPILOT_NAME}-backend   # read-only доступ к API кубера (discovery)
      nodeSelector:
        environment: ${ENV_PREFIX}
      imagePullSecrets:
        - name: harbor-secret
      containers:
        - name: backend
          image: ${BACKEND_IMAGE}
          ports:
            - containerPort: ${BACKEND_PORT}
          env:
            - name: XOPS_ENVIRONMENT          # dev|prod — фильтр неймспейсов и base_url
              value: ${ENV_PREFIX}
            - name: XOPS_COPILOT_HOST         # существующий ingress-хост UI и API копилотов
              value: ${COPILOT_HOST}
            - name: XOPS_PLATFORM_NAMESPACE   # исключить собственный неймспейс из каталога
              value: ${KUBE_NAMESPACE}
            - name: XOPS_BASE_PATH
              value: /${ENV_PREFIX}/${COPILOT_NAME}
            - name: XOPS_DATABASE_URL
              value: postgresql://xops@postgres-svc:5432/xops
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: ${COPILOT_NAME}-credentials
                  key: postgres-password
            - name: XOPS_ADMIN_PASSWORD_HASH
              valueFrom:
                secretKeyRef:
                  name: ${COPILOT_NAME}-credentials
                  key: admin-password-hash
            - name: XOPS_COOKIE_SECURE
              value: "${XOPS_COOKIE_SECURE}"
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /api/health
              port: ${BACKEND_PORT}
            initialDelaySeconds: 10
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /api/ready
              port: ${BACKEND_PORT}
            initialDelaySeconds: 5
            periodSeconds: 10
