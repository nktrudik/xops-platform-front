# Наружу выставлен ТОЛЬКО фронт-gateway. /api внутрь проксирует nginx (не Traefik).
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: ${COPILOT_NAME}-ingressroute
  namespace: ${KUBE_NAMESPACE}
spec:
  entryPoints:
    - web
  routes:
    - match: PathPrefix(`/${ENV_PREFIX}/${COPILOT_NAME}`)
      kind: Rule
      priority: 10
      middlewares:
        - name: ${COPILOT_NAME}-stripprefix
      services:
        - name: frontend-svc
          port: ${FRONTEND_PORT}
