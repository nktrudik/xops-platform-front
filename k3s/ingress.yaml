# Host-режим: платформа на домене в корне (prod → platform.<DOMAIN>, dev → platform-dev.<DOMAIN>).
# Наружу выставлен ТОЛЬКО фронт-gateway; /api внутрь проксирует nginx (не Traefik). stripPrefix не нужен — корень домена.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: ${COPILOT_NAME}-ingressroute
  namespace: ${KUBE_NAMESPACE}
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`${PLATFORM_HOST}`)
      kind: Rule
      priority: 10
      services:
        - name: frontend-svc
          port: ${FRONTEND_PORT}
