# Host-режим: платформа на домене ${INGRESS_HOST} в корне. Наружу выставлен ТОЛЬКО фронт-gateway;
# /api внутрь проксирует nginx (не Traefik), поэтому stripPrefix-middleware не нужен.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: ${COPILOT_NAME}-ingressroute
  namespace: ${KUBE_NAMESPACE}
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`${INGRESS_HOST}`)
      kind: Rule
      priority: 10
      services:
        - name: frontend-svc
          port: ${FRONTEND_PORT}
  tls: {}