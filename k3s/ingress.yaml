apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: ${COPILOT_NAME}-ingressroute
  namespace: ${KUBE_NAMESPACE}
spec:
  entryPoints:
    - web
  routes:
    # 1. Сначала ловим API и шлем сразу в бэкенд
    - match: Host(`${PLATFORM_HOST}`) && PathPrefix(`/api`)
      kind: Rule
      priority: 20 # Приоритет выше, чем у корневого пути
      services:
        - name: backend
          port: ${BACKEND_PORT}
      
    # 2. Всё остальное шлем во фронтенд
    - match: Host(`${PLATFORM_HOST}`)
      kind: Rule
      priority: 10
      services:
        - name: frontend-svc
          port: ${FRONTEND_PORT}