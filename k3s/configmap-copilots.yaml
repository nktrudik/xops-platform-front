# Каталог копилотов для бэкенда (монтируется в /app/data/copilots.json).
# Источник правды вместо запечённого в образ — менять список = правка здесь + передеплой (без пересборки).
# base_url должен быть ДОСТИЖИМ: из браузера (iframe) и из пода бэкенда (embedding-check httpx).
apiVersion: v1
kind: ConfigMap
metadata:
  name: ${COPILOT_NAME}-copilots
  namespace: ${KUBE_NAMESPACE}
data:
  copilots.json: |
    [
      {
        "copilot_name": "test-agent-alpha",
        "status": "available",
        "base_url": "http://${COPILOT_HOST}/${ENV_PREFIX}/test-agent-alpha",
        "icon": "sparkles",
        "metadata": {
          "display_name": "Test Agent Alpha",
          "description": "Тестовый AI Copilot с собственным интерфейсом.",
          "interface": { "type": "embedded", "path": "/" }
        }
      }
    ]

