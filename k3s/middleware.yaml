# Срезает префикс пути /<env>/platform-xops перед фронтом (nginx получает /, /api/..., /assets/..., /brand-fonts/...).
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: ${COPILOT_NAME}-stripprefix
  namespace: ${KUBE_NAMESPACE}
spec:
  stripPrefix:
    prefixes:
      - /${ENV_PREFIX}/${COPILOT_NAME}
