apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: ${KUBE_NAMESPACE}
  labels:
    app: frontend
spec:
  replicas: ${FRONTEND_REPLICAS}
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      nodeSelector:
        environment: ${ENV_PREFIX}
      imagePullSecrets:
        - name: harbor-secret
      containers:
        - name: frontend
          image: ${FRONTEND_IMAGE}
          ports:
            - containerPort: ${FRONTEND_PORT}
          volumeMounts:
            # шрифты из ConfigMap (optional — под стартует и без него, будут фолбэк-шрифты)
            - name: brand-fonts
              mountPath: /brand-fonts
              readOnly: true
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "250m"
          # Пробы на '/' (nginx отдаёт SPA) — не завязываемся на готовность бэкенда
          livenessProbe:
            httpGet:
              path: /
              port: ${FRONTEND_PORT}
            initialDelaySeconds: 10
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /
              port: ${FRONTEND_PORT}
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: brand-fonts
          configMap:
            name: ${COPILOT_NAME}-fonts
            optional: true
