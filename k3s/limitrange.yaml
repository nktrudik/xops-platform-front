apiVersion: v1
kind: LimitRange
metadata:
  name: ${COPILOT_NAME}-limits
  namespace: ${KUBE_NAMESPACE}
spec:
  limits:
    - type: Container
      max:
        cpu: "1"
        memory: "1Gi"
      min:
        cpu: "25m"
        memory: "32Mi"
      default:
        cpu: "250m"
        memory: "256Mi"
      defaultRequest:
        cpu: "50m"
        memory: "64Mi"
